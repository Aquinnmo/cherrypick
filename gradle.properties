#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# ponytail: AGP 9.0+ forbids com.android.application + kotlin.multiplatform in one
# module by default, pushing you toward a split composeApp(library)+app(application)
# layout. These two flags bypass that check so composeApp can stay a single module,
# matching every downstream bead's assumed file layout. Drop them (and split into
# two modules) if a future AGP removes the bypass.
android.builtInKotlin=false
android.newDsl=false